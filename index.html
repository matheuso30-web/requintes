<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requintes da Natureza | Perfumaria Exclusiva</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @media screen and (max-width: 480px) {
            header { padding: 5px !important; }
            .logo { font-size: 1.2rem !important; text-align: center !important; }
            nav { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 5px !important; }
            nav a { font-size: 11px !important; padding: 5px !important; }
            .hero { height: 320px !important; overflow: hidden !important; position: relative !important; }
            .hero img { width: 100% !important; height: 100% !important; object-fit: cover !important; object-position: center !important; }
            .hero-content h1 { font-size: 1.5rem !important; }
            
            /* Garante que qualquer imagem solta na hero também obedeça */
            section.hero img { max-width: 100% !important; height: auto !important; }
        }
    </style>
</head>
